name: Build RustPotato

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Copy binary
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "target\x86_64-pc-windows-msvc\release" -Filter *.exe | Select-Object -First 1
          Copy-Item $exe.FullName "RustPotato.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustpotato
          path: RustPotato.exe
